# Monitoring stack values
# Umbrella chart: kube-prometheus-stack + Loki + Mimir + MinIO + Alloy
#
# Deployed as Helm release "prometheus" in the monitoring namespace.
# NOT managed by ArgoCD — apply manually:
#   cd helm/prometheus && helm dependency update
#   helm upgrade prometheus . -n monitoring -f values.yaml
#
# Mimir is intentionally scaled to 0 replicas (death spiral under resource
# pressure). Re-enable by setting replicas back to 1 per component.

# ─── kube-prometheus-stack ───────────────────────────────────────────────────

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      priorityClassName: monitoring
      retention: 15d
      replicas: 1
      nodeSelector:
        kubernetes.io/hostname: vmi2951245
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 4Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 50Gi
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      remoteWrite:
        - name: mimir
          url: http://prometheus-mimir-gateway.monitoring.svc.cluster.local/api/v1/push
          remoteTimeout: 30s
          writeRelabelConfigs:
            - sourceLabels: [__name__]
              regex: "apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_body_size_bytes_bucket|apiserver_watch_events_sizes_bucket"
              action: drop
    ingress:
      enabled: false

  alertmanager:
    enabled: true
    alertmanagerSpec:
      priorityClassName: monitoring
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 2Gi
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal: [namespace, alertname]
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal: [namespace, alertname]
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal: [namespace]
        - target_matchers:
            - alertname = InfoInhibitor
      receivers:
        - name: "null"
        - name: gotify
          webhook_configs:
            - url: http://alertmanager-gotify-bridge.monitoring.svc.cluster.local:8080/gotify_webhook
              send_resolved: true
      route:
        group_by: [namespace]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: "null"
        routes:
          - matchers:
              - alertname = "Watchdog"
            receiver: "null"
          - matchers:
              - namespace = "gpu-operator"
              - alertname =~ "KubeDaemonSetMisScheduled|KubeDaemonSetRolloutStuck"
            receiver: "null"
          - matchers:
              - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
            receiver: "null"
          - matchers:
              - severity = "critical"
            receiver: gotify
          - matchers:
              - severity = "warning"
            receiver: gotify
    ingress:
      enabled: false

  grafana:
    enabled: true
    priorityClassName: monitoring
    # Credentials from Doppler via ExternalSecret (prometheus-grafana-external-secret.yaml)
    admin:
      existingSecret: prometheus-grafana
      userKey: admin-user
      passwordKey: admin-password
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    grafana.ini:
      server:
        domain: grafana.el-jefe.me
        root_url: https://grafana.el-jefe.me/
        serve_from_sub_path: false
    defaultDashboardsEnabled: true
    defaultDashboardsTimezone: UTC
    sidecar:
      datasources:
        enabled: true
        defaultDatasourceEnabled: false
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://prometheus-loki.monitoring.svc.cluster.local:3100
        uid: loki
        editable: true
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://prometheus-mimir-gateway.monitoring.svc.cluster.local/prometheus
        uid: mimir
        editable: true
    ingress:
      enabled: false

  prometheusOperator:
    enabled: true
    livenessProbe:
      timeoutSeconds: 5
    readinessProbe:
      timeoutSeconds: 5
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true
  kube-state-metrics:
    nodeSelector:
      kubernetes.io/hostname: vmi2951245

# ─── Traefik ingress (custom template) ──────────────────────────────────────

ingress:
  enabled: true
  prometheusHost: prometheus.el-jefe.me
  prometheusService: prometheus-kube-prometheus-prometheus
  prometheusPort: 9090
  grafanaHost: grafana.el-jefe.me
  grafanaService: prometheus-grafana
  grafanaPort: 80

# ─── Gotify alert bridge (custom template) ──────────────────────────────────

gotifyBridge:
  enabled: true
  image:
    repository: ghcr.io/druggeri/alertmanager_gotify_bridge
    tag: 2.3.2
  gotifyEndpoint: http://gotify.monitoring.svc.cluster.local
  defaultPriority: "5"
  tokenSecret:
    name: gotify-alertmanager-token
    key: gotify-token
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
  serviceMonitor:
    enabled: true

# ─── MinIO (S3 backend for Loki + Mimir) ────────────────────────────────────

minio:
  enabled: true
  priorityClassName: monitoring
  mode: standalone
  replicas: 1
  existingSecret: minio-credentials
  nodeSelector:
    kubernetes.io/hostname: vmi2951245
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  buckets:
    - name: loki-chunks
      policy: none
      purge: false
    - name: loki-ruler
      policy: none
      purge: false
    - name: mimir-blocks
      policy: none
      purge: false
    - name: mimir-ruler
      policy: none
      purge: false
    - name: mimir-alertmanager
      policy: none
      purge: false
  metrics:
    serviceMonitor:
      enabled: true

# ─── Loki (single binary mode) ──────────────────────────────────────────────

loki:
  enabled: true
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    persistence:
      size: 5Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: minio-credentials
  # Disable multi-component modes (using SingleBinary)
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    enabled: false
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
      s3:
        endpoint: http://prometheus-minio.monitoring.svc.cluster.local:9000
        region: us-east-1
        s3forcepathstyle: true
        insecure: true
        bucketnames: loki-chunks
        access_key_id: ${rootUser}
        secret_access_key: ${rootPassword}
    limits_config:
      retention_period: 360h
    compactor:
      working_directory: /var/loki/compactor
      delete_request_store: filesystem
      retention_enabled: true
    rulerConfig:
      storage:
        type: s3
        s3:
          endpoint: http://prometheus-minio.monitoring.svc.cluster.local:9000
          region: us-east-1
          s3forcepathstyle: true
          insecure: true
          bucketnames: loki-ruler
          access_key_id: ${MINIO_ROOT_USER}
          secret_access_key: ${MINIO_ROOT_PASSWORD}
  chunksCache:
    allocatedMemory: 256
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 200m
        memory: 512Mi
  resultsCache:
    allocatedMemory: 128
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        cpu: 200m
        memory: 256Mi
  monitoring:
    lokiCanary:
      enabled: false
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

# ─── Alloy (log collection agent) ───────────────────────────────────────────

alloy:
  enabled: true
  controller:
    type: daemonset
    priorityClassName: monitoring
    volumes:
      extra:
        - name: geoip-db
          hostPath:
            path: /usr/share/GeoIP
            type: Directory
  alloy:
    configMap:
      create: false
      name: alloy-config
      key: config.alloy
    mounts:
      varlog: true
      dockercontainers: true
      extra:
        - name: geoip-db
          mountPath: /usr/share/GeoIP
          readOnly: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ─── Mimir (long-term metrics storage) ──────────────────────────────────────

mimir-distributed:
  enabled: true
  minio:
    enabled: false  # Uses shared MinIO above
  rollout_operator:
    enabled: false
  global:
    extraEnvFrom:
      - secretRef:
          name: minio-credentials
  mimir:
    structuredConfig:
      common:
        storage:
          backend: s3
          s3:
            endpoint: prometheus-minio.monitoring.svc.cluster.local:9000
            insecure: true
            access_key_id: ${rootUser}
            secret_access_key: ${rootPassword}
      blocks_storage:
        s3:
          bucket_name: mimir-blocks
        tsdb:
          dir: /data/tsdb
        bucket_store:
          sync_dir: /data/tsdb-sync
      ruler_storage:
        s3:
          bucket_name: mimir-ruler
      alertmanager_storage:
        s3:
          bucket_name: mimir-alertmanager
      compactor:
        data_dir: /data/compactor
        compaction_interval: 30m
      ingester:
        ring:
          replication_factor: 1
      store_gateway:
        sharding_ring:
          replication_factor: 1
      alertmanager:
        sharding_ring:
          replication_factor: 1
      limits:
        ingestion_rate: 100000
        ingestion_burst_size: 2000000
        max_global_series_per_user: 500000
        compactor_blocks_retention_period: 2160h
  distributor:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 2Gi
  ingester:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    persistentVolume:
      size: 10Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    zoneAwareReplication:
      enabled: false
  querier:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  query_frontend:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  query_scheduler:
    replicas: 0
  compactor:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    persistentVolume:
      size: 10Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  store_gateway:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    persistentVolume:
      size: 10Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    zoneAwareReplication:
      enabled: false
  ruler:
    replicas: 0
  alertmanager:
    replicas: 0
  overrides_exporter:
    replicas: 1
  kafka:
    replicas: 1
    priorityClassName: monitoring
    nodeSelector:
      kubernetes.io/hostname: vmi2951245
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi
    podAnnotations:
      backup.velero.io/backup-volumes-excludes: kafka-data
    extraEnv:
      - name: KAFKA_MESSAGE_MAX_BYTES
        value: "16777216"
      - name: KAFKA_REPLICA_FETCH_MAX_BYTES
        value: "16777216"

# ─── Velero backup schedules (custom templates) ─────────────────────────────

veleroSchedules:
  enabled: true
  namespace: velero
  excludedNamespaces:
    - gpu-operator
  daily:
    schedule: "0 2 * * *"
    ttl: 168h0m0s
  weekly:
    schedule: "0 3 * * 0"
    ttl: 720h0m0s

veleroAlerts:
  enabled: true
  namespace: velero

veleroBackupVerify:
  enabled: true
  schedule: "0 4 * * 0"
