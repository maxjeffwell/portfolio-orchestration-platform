#
# ⚠ UNINSTALLED 2026-06-10 — this is a dormant reinstall recipe, NOT a live deployment.
# Removed (`helm uninstall network-mapper -n otterize-system`) + namespace deleted to
# reclaim ~3.6 cores / ~800Mi of continuous usage (the sniffer DaemonSet was burning ~1
# core per node and OOM-restarting 592x on debian-marmoset against a 256Mi limit). It was
# observe-only (no enforcement), and its traffic graph was not in active use.
# To bring it back, run the Deploy command below. If you do, raise the sniffer memory
# limit (was 256Mi → use ~512Mi) so it stops OOMing on the densest node.
#
# Otterize Network Mapper - Self-hosted, no cloud account, no enforcement.
# Just observes inter-service traffic and exposes a graph via the otterize CLI.
#
# Deploy:
#   helm install network-mapper otterize/network-mapper -n otterize-system \
#     --create-namespace -f values.yaml
#

# Disable cloud telemetry entirely - self-hosted only.
global:
  telemetry:
    enabled: false
    usage:
      enabled: false

# Don't try to report internet-facing traffic to Otterize Cloud (we have no cloud).
enableInternetFacingTrafficReporting: false

# No Istio in this cluster.
enableIstioCollection: false

# Central mapper deployment - aggregates sniffer reports, serves the CLI query API.
mapper:
  priorityClassName: monitoring
  resources:
    requests:
      cpu: 50m
      # Bumped 128Mi->256Mi + 512Mi->1Gi: in self-hosted mode the mapper
      # retains the full discovered-intent graph in memory (the CLI queries it),
      # so memory is a working set that grows with cumulative connections.
      # 512Mi OOMKilled it every ~10min on this cluster (exit 137). If 1Gi still
      # OOMs, go to 2Gi. See memory: otterize-network-mapper-oom-2026-05-29.
      memory: 256Mi
    limits:
      memory: 1Gi
  excludeNamespaces:
    - istio-system
    - linkerd
    # Skip our own pods - reduces noise in the graph.
    - otterize-system
    # kube-system is high-volume and not actionable for app-level mapping.
    - kube-system
    # Velero backup pods are ephemeral and produce churn.
    - velero
    # Mayastor control plane pods chatter constantly between themselves.
    - mayastor

# Per-node sniffer DaemonSet - tcpdump-equivalent via raw sockets (NET_RAW + SYS_PTRACE).
sniffer:
  enable: true
  priorityClassName: monitoring
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# eBPF node agent - more accurate but more invasive. Leave off; sniffer is enough for mapping.
nodeagent:
  enable: false

# Kafka topic-level mapping. Not running Kafka workloads under Otterize - leave off.
kafkawatcher:
  enable: false
