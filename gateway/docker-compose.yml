version: "3.8"

services:
  gateway:
    build: .
    command: node --watch src/index.js
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - CORS_ORIGIN=http://localhost:8000,http://localhost:9000
      - KUBECONFIG_PATH=/home/nodejs/.kube/config
    volumes:
      - ./src:/app/src
      - ${HOME}/.kube/config:/home/nodejs/.kube/config:ro
    restart: unless-stopped
