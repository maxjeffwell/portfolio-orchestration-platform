name: Build and Deploy GraphQL Gateway

on:
  push:
    branches: [ "main" ]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-and-deploy-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

jobs:
  build-and-push:
    name: Build and Push Gateway Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch secrets from Doppler
        run: |
          echo "DOCKERHUB_USERNAME=$(doppler secrets get DOCKERHUB_USERNAME --plain)" >> $GITHUB_ENV
          echo "DOCKERHUB_TOKEN=$(doppler secrets get DOCKERHUB_TOKEN --plain)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            maxjeffwell/graphql-gateway:${{ steps.meta.outputs.tag }}
            maxjeffwell/graphql-gateway:latest
            ghcr.io/maxjeffwell/graphql-gateway:${{ steps.meta.outputs.tag }}
            ghcr.io/maxjeffwell/graphql-gateway:latest
          cache-from: type=registry,ref=maxjeffwell/graphql-gateway:buildcache
          cache-to: type=registry,ref=maxjeffwell/graphql-gateway:buildcache,mode=max

  trigger-k8s-deploy:
    name: Trigger K8s Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Gateway deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: maxjeffwell/devops-portfolio-manager
          event-type: deploy-gateway
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "image_tag": "${{ needs.build-and-push.outputs.image-tag }}"}'

      - name: Log trigger
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          echo "Triggered deploy-gateway with image tag: ${IMAGE_TAG}"
