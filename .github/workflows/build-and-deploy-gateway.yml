name: Build and Deploy GraphQL Gateway

on:
  push:
    branches: [ "main" ]
    paths:
      - 'gateway/**'
      - '.github/workflows/build-and-deploy-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

jobs:
  build-and-push:
    name: Build and Push Gateway Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch secrets from Doppler
        run: |
          echo "DOCKERHUB_USERNAME=$(doppler secrets get DOCKERHUB_USERNAME --plain)" >> $GITHUB_ENV
          echo "DOCKERHUB_TOKEN=$(doppler secrets get DOCKERHUB_TOKEN --plain)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          TAG="$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building with tag: ${TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: |
            maxjeffwell/graphql-gateway:${{ steps.meta.outputs.tag }}
            maxjeffwell/graphql-gateway:latest
          cache-from: type=registry,ref=maxjeffwell/graphql-gateway:buildcache
          cache-to: type=registry,ref=maxjeffwell/graphql-gateway:buildcache,mode=max

  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: gitops-update-gateway
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update manifests and push
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Updating gateway image tag to: ${IMAGE_TAG}"

          MAX_RETRIES=5
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            git fetch origin main
            git reset --hard origin/main

            sed -i "s|image: maxjeffwell/graphql-gateway:.*|image: maxjeffwell/graphql-gateway:${IMAGE_TAG}|" k8s/deployments/gateway-deployment.yaml

            if git diff --quiet k8s/deployments/; then
              echo "No changes needed - tag already set to ${IMAGE_TAG}"
              exit 0
            fi

            git add k8s/deployments/gateway-deployment.yaml
            git commit -m "Update gateway image tag to ${IMAGE_TAG}"

            if git push origin main; then
              echo "Manifests updated. ArgoCD will automatically deploy."
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Push failed (attempt $RETRY_COUNT/$MAX_RETRIES), retrying..."
            sleep $((RETRY_COUNT * 2))
          done

          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1
