name: Build and Deploy POP

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'
      - 'dashboard/**'
      - 'k8s/**'
      - '.github/workflows/build-and-deploy-pop.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            maxjeffwell/portfolio-api:latest
            maxjeffwell/portfolio-api:${{ github.sha }}
          cache-from: type=registry,ref=maxjeffwell/portfolio-api:buildcache
          cache-to: type=registry,ref=maxjeffwell/portfolio-api:buildcache,mode=max

      - name: Build and push Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: |
            maxjeffwell/portfolio-dashboard:latest
            maxjeffwell/portfolio-dashboard:${{ github.sha }}
          cache-from: type=registry,ref=maxjeffwell/portfolio-dashboard:buildcache
          cache-to: type=registry,ref=maxjeffwell/portfolio-dashboard:buildcache,mode=max

  update-manifests:
    name: Update K8s Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in manifests
        run: |
          sed -i "s|maxjeffwell/portfolio-api:.*|maxjeffwell/portfolio-api:${{ github.sha }}|g" k8s/deployments/portfolio-api-deployment.yaml
          sed -i "s|maxjeffwell/portfolio-dashboard:.*|maxjeffwell/portfolio-dashboard:${{ github.sha }}|g" k8s/deployments/portfolio-dashboard-deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployments/
          git diff --staged --quiet || git commit -m "Update POP images to ${{ github.sha }}"
          git push
