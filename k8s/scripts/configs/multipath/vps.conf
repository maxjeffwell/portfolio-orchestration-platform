# Multipath config for K3s VPS nodes (vmi2951245 + vmi3115606).
#
# `find_multipaths smart` solves the synology-csi v1.2.1 mount-conflict:
#   - Single-path LUN observed → released for direct kubelet /dev/sdN mount
#     (CSI driver mounts via /dev/disk/by-path/...lun-N which resolves to /dev/sdN)
#   - Same-WWID on 2+ paths    → aggregated into /dev/mapper/mpathN
#     (corruption guard for the future multi-portal PV case)
#
# Why keep multipathd running at all on VPS workers:
#   The in-tree iSCSI driver opens N sessions when a PV lists multiple
#   portals (targetPortal + portals[]). Without multipath, two /dev/sdX
#   writes to the same LUN can corrupt data. multipathd is the safety net.
defaults {
    user_friendly_names yes
    find_multipaths smart
}
