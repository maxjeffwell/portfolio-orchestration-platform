defaults {
    user_friendly_names yes
    find_multipaths yes
    path_grouping_policy multibus
    no_path_retry queue
    path_checker tur
}

blacklist {
    devnode "^(ram|raw|loop|fd|md|dm-|sr|scd|st)[0-9]*"
    devnode "^nvme[0-9]+n[0-9]+p[0-9]+$"
}

# ASUSTOR iSCSI Storage doesn't expose a SCSI WWID (uid_attribute defaults
# to ID_WWN which returns empty). Use ID_SERIAL instead so multipathd can
# group paths to the same LUN. Without this, mpath devices never form for
# ASUSTOR LUNs.
devices {
    device {
        vendor "ASUSTOR"
        product "iSCSI Storage"
        uid_attribute "ID_SERIAL"
        path_grouping_policy "multibus"
        path_checker "tur"
        no_path_retry queue
        failback immediate
    }
}

# Per-LUN multipath aliases for Synology iSCSI PVs.
#
# Add a `multipath { wwid "..."; alias mpath-<name> }` block here for each
# Synology PVC that becomes multi-pathed (i.e., has multiple portal IPs
# active simultaneously). Find the WWID with:
#   /lib/udev/scsi_id -g -u /dev/sdX
#
# Note: PVC UUIDs change as CNPG / other operators recreate instances.
# These entries will go stale and need to be cleaned out periodically.
multipaths {
    multipath {
        wwid "0x6001405136b000adfbe9d4ae3d8682d0"
        alias mpathd-codetalk-8
    }
}
