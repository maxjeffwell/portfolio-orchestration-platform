# Snippet to ensure these defaults are set in /etc/iscsi/iscsid.conf
# (the values shipped commented-out; we need them active).
#
# Why CRC32C,None: Synology DSM 7.x flips on iSCSI digest negotiation when
# max_sessions=0 (unlimited) is enabled. CRC32C is the only digest both
# sides agree on. "None" as second token lets either side disable it via
# the GUI without breaking the login.
#
# Affects: any node mounting Synology iSCSI PVs (currently debian-marmoset;
# would also apply if synology-csi extends to VPSes).
#
# Application: replace the existing commented-out defaults near line ~310
# of /etc/iscsi/iscsid.conf with the lines below.

node.conn[0].iscsi.HeaderDigest = CRC32C,None
node.conn[0].iscsi.DataDigest = CRC32C,None
