# K3s node inotify tuning — applies to all K3s nodes in this cluster.
#
# Why: default Linux fs.inotify.max_user_instances=128 is too low for K8s
# nodes hosting many pods. The root user (containerd, kubelet, all
# containers' main processes, fsnotify sidecars) easily exhausts 128
# instances, including blocking systemd-udevd from initializing — which
# silently breaks CSI iSCSI mounts (no /dev/disk/by-path symlinks).
#
# Per memory: inotify-k8s-node-tuning (originally applied 2026-05-04
# to vmi2951245 + vmi3115606 + debian-marmoset after CNPG cluster
# rollout failures traced back to udevd starvation). Marmoset added
# 2026-05-25 alongside the flannel.1 watchdog rollout.
#
# Filename gotcha: this MUST sort before any legacy `99-inotify.conf`
# (last-loaded sysctl drop-in wins). 99-inotify-k8s.conf sorts before
# 99-inotify.conf because '-' (0x2D) < '.' (0x2E).

fs.inotify.max_user_watches=1048576
fs.inotify.max_user_instances=8192
