---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
  labels:
    app: blackbox-exporter
data:
  blackbox.yml: |
    modules:
      # DNS probe for internal cluster DNS
      dns_cluster:
        prober: dns
        timeout: 5s
        dns:
          query_name: "kubernetes.default.svc.cluster.local"
          query_type: "A"
          transport_protocol: "udp"
          preferred_ip_protocol: "ip4"
          valid_rcodes:
            - NOERROR

      # DNS probe for external resolution (tests forwarding)
      dns_external:
        prober: dns
        timeout: 5s
        dns:
          query_name: "google.com"
          query_type: "A"
          transport_protocol: "udp"
          preferred_ip_protocol: "ip4"
          valid_rcodes:
            - NOERROR

      # HTTP probe (useful for other checks)
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200, 201, 202, 204]
          method: GET
          preferred_ip_protocol: "ip4"

      # TCP probe
      tcp_connect:
        prober: tcp
        timeout: 5s

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
    spec:
      containers:
      - name: blackbox-exporter
        image: prom/blackbox-exporter:v0.25.0
        args:
          - --config.file=/etc/blackbox/blackbox.yml
          - --log.level=info
        ports:
        - containerPort: 9115
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        # 2026-10-07: separate checks. Readiness (/-/ready) pulls the pod from the
        # Service quickly; liveness (/-/healthy, process alive) is more patient,
        # so a slow moment is not answered with a restart. Both endpoints come
        # from the exporter's own web toolkit (v0.25.0).
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: config
          mountPath: /etc/blackbox
          readOnly: true
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
      volumes:
      - name: config
        configMap:
          name: blackbox-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app: blackbox-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9115
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: blackbox-exporter
