apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: default
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 30Gi
    limits.memory: 50Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 20Gi
    # 36Gi → 38Gi: namespace was maxed (36762/36864Mi), blocking the Alertmanager
    # pod (needs 306Mi) from scheduling for 29h → no alert delivery cluster-wide.
    limits.memory: 38Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: langfuse-quota
  namespace: langfuse
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 12Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: microservices-quota
  namespace: microservices
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 8Gi
