apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: default
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 30Gi
    limits.memory: 50Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "8"
    # 20Gi → 28Gi (2026-09-30): requests at 18560Mi/20Gi (91%), KubeQuotaAlmostFull
    # firing; Prometheus 3.6Gi + Mimir 2Gi + Tempo 1.6Gi + 5× Alloy 1.3Gi. Any new
    # pod in the namespace would be refused. Limits raised in step to keep the
    # ~2:1 limits:requests ratio.
    requests.memory: 28Gi
    # 36Gi → 38Gi: namespace was maxed (36762/36864Mi), blocking the Alertmanager
    # pod (needs 306Mi) from scheduling for 29h → no alert delivery cluster-wide.
    # 38Gi → 42Gi: 37/38Gi with 6 nodes; each new node adds an Alloy DaemonSet
    # pod (3Gi+128Mi limits) that would be silently refused at 38Gi.
    # 42Gi → 56Gi (2026-09-30): 38336Mi/42Gi (89%), raised with requests above.
    limits.memory: 56Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: microservices-quota
  namespace: microservices
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 8Gi
