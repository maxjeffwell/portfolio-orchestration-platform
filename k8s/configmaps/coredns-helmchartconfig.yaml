# CoreDNS HelmChartConfig
# Applies to: kube-system namespace
# Purpose: Override K3s-managed CoreDNS Helm chart values so settings persist
#          across K3s restarts and upgrades. This is the K3s-native way to
#          customize addon configurations without them being overwritten.
#
# Changes from default:
# - cache 30 -> cache 300 (5 min) with prefetch
# - forward to Cloudflare/Google instead of node resolv.conf
#
# Apply with: kubectl apply -f coredns-helmchartconfig.yaml
# K3s will re-render the CoreDNS Helm chart with these values automatically.

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: coredns
  namespace: kube-system
spec:
  valuesContent: |-
    servers:
    - zones:
      - zone: .
        scheme: dns://
      port: 53
      plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
      - name: hosts
        parameters: /etc/coredns/NodeHosts
        configBlock: |-
          ttl 60
          reload 15s
          fallthrough
      - name: prometheus
        parameters: :9153
      - name: cache
        parameters: 300
        configBlock: |-
          prefetch 10 60s 25%
      - name: loop
      - name: reload
      - name: loadbalance
      - name: import
        parameters: /etc/coredns/custom/*.override
      - name: forward
        parameters: . 1.1.1.1 8.8.8.8
        configBlock: |-
          policy sequential
    - zones:
      - zone: .
      plugins:
      - name: import
        parameters: /etc/coredns/custom/*.server
