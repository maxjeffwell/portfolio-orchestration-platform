# CoreDNS Custom Overrides
# Applies to: kube-system namespace
# Purpose: K3s imports files from this ConfigMap into the main Corefile
#          via `import /etc/coredns/custom/*.override`
#
# disable-ipv6.override:
#   Strips AAAA (IPv6) records from external DNS responses.
#   Flannel VXLAN overlay is IPv4-only, so pods can't reach IPv6 addresses.
#   Without this, Go's Happy Eyeballs tries IPv6 first, hangs until timeout,
#   then falls back to IPv4.
#
# doppler-proxy.override:
#   Rewrites api.doppler.com DNS to the in-cluster haproxy proxy.
#   Mitigates Contabo-Cloudflare peering issues (10-20% TCP SYN drops).
#   HAProxy retries on a different Cloudflare IP within 2s.
#   TLS passes through end-to-end (Layer 4 proxy).
#
# home-arpa.server:
#   Serves the internal home.arpa zone.
#   asustor-smb.home.arpa -> ASUSTOR eth2 (5G), the source for the smb-asustor
#   StorageClass. Addressed by name because csi-driver-smb bakes `source` into
#   each PV immutably; repointing to .142/.133 must not require PV rebuilds.
#   (backrest.home.arpa removed 2026-10-06: the backrest app was retired 2026-08-29 and
#   the entry pointed at a dead VPS IP and m920s, neither of which served it.)
#   The `forward . /etc/resolv.conf` after `hosts` is required: node-local-dns routes the
#   whole home.arpa zone here, so without a forward, any home.arpa name not in the hosts
#   block (previously resolvable via each node's upstream resolver) now SERVFAILs from pods.
#
# Apply with: kubectl apply -f coredns-custom.yaml
# Then restart: kubectl rollout restart deployment coredns -n kube-system

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  disable-ipv6.override: |
    template IN AAAA . {
      rcode NOERROR
    }
  doppler-proxy.override: |
    rewrite stop {
      name exact api.doppler.com doppler-proxy.external-secrets.svc.cluster.local
      answer name doppler-proxy.external-secrets.svc.cluster.local api.doppler.com
    }
  home-arpa.server: |
    home.arpa:53 {
      errors
      cache 30
      hosts {
        192.168.50.149 asustor-smb.home.arpa
        fallthrough
      }
      forward . /etc/resolv.conf
    }
