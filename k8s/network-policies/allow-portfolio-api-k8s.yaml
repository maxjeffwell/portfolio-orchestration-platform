apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portfolio-api-k8s
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: portfolio-api
  policyTypes:
  - Egress
  egress:
  # Allow K8s API via endpoint IP (post-DNAT destination on WireGuard network)
  - to:
    - ipBlock:
        cidr: 10.0.0.0/24
    ports:
    - port: 6443
      protocol: TCP
  # Allow K8s API via ClusterIP (pre-DNAT destination)
  - to:
    - ipBlock:
        cidr: 10.43.0.0/16
    ports:
    - port: 443
      protocol: TCP
  # Allow K8s API via node external IP
  - to:
    - ipBlock:
        cidr: 86.48.29.183/32
    ports:
    - port: 6443
      protocol: TCP
  # Allow Prometheus pod network access
  - to:
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - port: 9090
      protocol: TCP
