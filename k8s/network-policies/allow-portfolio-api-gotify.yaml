apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portfolio-api-gotify
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: portfolio-api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app: gotify
    ports:
    - protocol: TCP
      port: 80
