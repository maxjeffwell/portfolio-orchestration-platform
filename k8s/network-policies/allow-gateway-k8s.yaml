apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-k8s
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: gateway-server
  policyTypes:
  - Egress
  egress:
  # Allow K8s API via endpoint IP (post-DNAT destination on WireGuard network)
  - to:
    - ipBlock:
        cidr: 10.0.0.0/24
    ports:
    - port: 6443
      protocol: TCP
  # Allow K8s API via ClusterIP
  - to:
    - ipBlock:
        cidr: 10.43.0.0/16
    ports:
    - port: 443
      protocol: TCP
  # Allow K8s API via node external IP
  - to:
    - ipBlock:
        cidr: 86.48.29.183/32
    ports:
    - port: 6443
      protocol: TCP
  # Allow Prometheus (monitoring namespace, port 9090)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090
      protocol: TCP
  # Allow ArgoCD (argocd namespace, port 8080)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: argocd
    ports:
    - port: 8080
      protocol: TCP
  # Allow pod-to-pod (post-DNAT targets)
  - to:
    - ipBlock:
        cidr: 10.42.0.0/16
    ports:
    - port: 8080
      protocol: TCP
    - port: 9090
      protocol: TCP
