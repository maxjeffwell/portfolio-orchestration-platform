---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-api-stripprefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
      - /portfolio
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: default-portfolio-api-stripprefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      # API routes - strip /portfolio prefix before forwarding
      - path: /portfolio/api
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      # Dashboard routes - nginx will handle the prefix
      - path: /portfolio
        pathType: Prefix
        backend:
          service:
            name: portfolio-dashboard
            port:
              number: 80
---
# Direct API routes with higher priority to handle /api/* requests from the frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-api-direct
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "200"
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      - path: /api/pods
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      - path: /api/deployments
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      - path: /api/metrics
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      - path: /api/prometheus
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
