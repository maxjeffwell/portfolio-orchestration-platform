apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-orchestration-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pop-portfolio.el-jefe.me
    secretName: pop-portfolio-tls
  rules:
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      # 1. Dashboard (Lower Priority / Default)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portfolio-dashboard
            port:
              number: 80
      
      # 2. Legacy /portfolio path
      - path: /portfolio
        pathType: Prefix
        backend:
          service:
            name: portfolio-dashboard
            port:
              number: 80

---
# Direct API routes with higher priority to handle /api/* requests from the frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-orchestration-api-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "200"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pop-portfolio.el-jefe.me
    secretName: pop-portfolio-tls
  rules:
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000
      - path: /portfolio/api
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000

---
# Portfolio Apps with medium priority
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-apps-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "150"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pop-portfolio.el-jefe.me
    secretName: pop-portfolio-tls
  rules:
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      # Bookmarked App
      - path: /bookmarked
        pathType: Prefix
        backend:
          service:
            name: bookmarked-client
            port:
              number: 80

      # Firebook App
      - path: /firebook
        pathType: Prefix
        backend:
          service:
            name: firebook
            port:
              number: 80

      # IntervalAI App
      - path: /intervalai
        pathType: Prefix
        backend:
          service:
            name: intervalai-client
            port:
              number: 80

      # EducationELLy App
      - path: /educationelly
        pathType: Prefix
        backend:
          service:
            name: educationelly-client
            port:
              number: 3000

      # EducationELLy GraphQL App
      - path: /educationelly-graphql
        pathType: Prefix
        backend:
          service:
            name: educationelly-graphql-client
            port:
              number: 80

      # Code Talk App
      - path: /code-talk
        pathType: Prefix
        backend:
          service:
            name: code-talk-client
            port:
              number: 5000

      # TenantFlow App
      - path: /tenantflow
        pathType: Prefix
        backend:
          service:
            name: tenantflow-frontend
            port:
              number: 80

      # DevOps Portfolio Dashboard
      - path: /devops-portfolio
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80

      # DevOps Portfolio API
      - path: /devops-portfolio-api
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-api
            port:
              number: 5001