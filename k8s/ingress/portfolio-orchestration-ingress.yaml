apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-orchestration-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pop-portfolio.el-jefe.me
    - vertex-platform.el-jefe.me
    secretName: portfolio-orchestration-tls
  rules:
  # 1. Pop Portfolio (Dashboard + Consolidated Apps)
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      # Dashboard (Root)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pop-portfolio-dashboard
            port:
              number: 80

      # Legacy Portfolio Dashboard
      - path: /portfolio
        pathType: Prefix
        backend:
          service:
            name: pop-portfolio-dashboard
            port:
              number: 80

      # Portfolio API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: portfolio-api
            port:
              number: 5000

      # Note: App routes (/bookmarked, /firebook, /intervalai, /educationelly,
      # /educationelly-graphql, /code-talk) are in portfolio-apps-ingress.yaml
      # with stripPrefix middleware applied

  # TenantFlow moved: tenantflow.el-jefe.me is served by platform-ingress in
  # the multi-tenant-platform namespace (GitOps: k8s-multi-tenant-platform).

  # 3. Vertex Platform (Subdomain) - Microservices API
  - host: vertex-platform.el-jefe.me
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-auth
            port:
              number: 3001
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-analytics
            port:
              number: 3005
      # Default route to auth service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-auth
            port:
              number: 3001

