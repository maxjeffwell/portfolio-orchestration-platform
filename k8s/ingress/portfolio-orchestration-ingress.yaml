apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-orchestration-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - pop-portfolio.el-jefe.me
    - tenantflow.el-jefe.me
    - vertex-platform.el-jefe.me
    - podrick.el-jefe.me
    secretName: pop-portfolio-tls
  rules:
  # 1. Pop Portfolio (Dashboard + Consolidated Apps)
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      # Dashboard (Root)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80
              
      # Dashboard API (Direct)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-api
            port:
              number: 5001

      # Legacy Portfolio Dashboard
      - path: /portfolio
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80

      # -- App Paths (Stay on Main Domain) --

      # Bookmarked
      - path: /bookmarked
        pathType: Prefix
        backend:
          service:
            name: bookmarked-client
            port:
              number: 80

      # Firebook
      - path: /firebook
        pathType: Prefix
        backend:
          service:
            name: firebook
            port:
              number: 80

      # IntervalAI
      - path: /intervalai
        pathType: Prefix
        backend:
          service:
            name: intervalai-client
            port:
              number: 80

      # EducationELLy
      - path: /educationelly
        pathType: Prefix
        backend:
          service:
            name: educationelly-client
            port:
              number: 3000

      # EducationELLy GraphQL
      - path: /educationelly-graphql
        pathType: Prefix
        backend:
          service:
            name: educationelly-graphql-client
            port:
              number: 80

      # Code Talk
      - path: /code-talk
        pathType: Prefix
        backend:
          service:
            name: code-talk-client
            port:
              number: 5000

  # 2. TenantFlow (Subdomain)
  - host: tenantflow.el-jefe.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: tenantflow-frontend
            port:
              number: 80

  # 3. Vertex Platform (Subdomain) - Microservices API
  - host: vertex-platform.el-jefe.me
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-auth
            port:
              number: 3001
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-analytics
            port:
              number: 3005
      # Default route to auth service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vertex-platform-auth
            port:
              number: 3001

  # 4. Podrick (Subdomain) - Shares devops-portfolio deployment
  - host: podrick.el-jefe.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-dashboard
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: devops-portfolio-api
            port:
              number: 5001