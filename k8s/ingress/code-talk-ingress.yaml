apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-talk-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: traefik
  rules:
  - host: code-talk-k8s.el-jefe.me
    http:
      paths:
      # GraphQL endpoint (must come before / to take precedence)
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: code-talk-server
            port:
              number: 8000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: code-talk-server
            port:
              number: 8000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: code-talk-server
            port:
              number: 8000
      # Client (catch-all, must be last)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: code-talk-client
            port:
              number: 5000
  tls:
  - hosts:
    - code-talk-k8s.el-jefe.me
    secretName: code-talk-ingress-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix-codetalk
  namespace: default
spec:
  stripPrefix:
    prefixes:
    - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: code-talk-api
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`code-talk-k8s.el-jefe.me`) && PathPrefix(`/api`)
    middlewares:
    - name: crowdsec-bouncer
    - name: strip-api-prefix-codetalk
    services:
    - name: code-talk-server
      port: 8000
  tls:
    secretName: code-talk-tls
