# Ingress for influxdb.el-jefe.me (monitoring namespace).
# Moved from devops-portfolio-manager/k8s/monitoring/influxdb.yaml on 2026-09-26 (was applied by hand;
# repo matched live exactly). Synced by the portfolio-orchestration-platform
# ArgoCD app (k8s/ingress source).
# The InfluxDB StatefulSet/Service/ExternalSecret stay in that file (hand-applied).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: influxdb-ingress
  namespace: monitoring
  labels:
    app: influxdb
    portfolio: 'true'
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
spec:
  ingressClassName: traefik
  rules:
  - host: influxdb.el-jefe.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: influxdb
            port:
              number: 8086
  tls:
  - hosts:
    - influxdb.el-jefe.me
    secretName: influxdb-tls
