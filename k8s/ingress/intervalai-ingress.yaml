apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intervalai-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-crowdsec-bouncer@kubernetescrd
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: traefik
  rules:
  - host: intervalai-k8s.el-jefe.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: intervalai-client
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: intervalai-server
            port:
              number: 8080
  tls:
  - hosts:
    - intervalai-k8s.el-jefe.me
    secretName: intervalai-ingress-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: default
spec:
  stripPrefix:
    prefixes:
    - /api
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: intervalai-api
  namespace: default
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`intervalai-k8s.el-jefe.me`) && PathPrefix(`/api`)
    middlewares:
    - name: crowdsec-bouncer
      namespace: kube-system
    - name: strip-api-prefix
    services:
    - name: intervalai-server
      port: 8080
  tls:
    secretName: intervalai-tls
