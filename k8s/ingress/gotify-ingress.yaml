# Moved from k8s/gotify/ on 2026-09-26 so the portfolio-orchestration-platform
# ArgoCD app (k8s/ingress source) manages it. The rest of k8s/gotify is still
# hand-applied.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gotify-ingress
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: traefik
  rules:
    - host: gotify.el-jefe.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gotify
                port:
                  number: 80
  tls:
  - hosts:
    - gotify.el-jefe.me
    secretName: gotify-tls
