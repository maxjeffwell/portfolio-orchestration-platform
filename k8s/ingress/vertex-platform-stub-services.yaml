# Stub services for vertex-platform ingress rules
# These prevent Traefik "service not found" errors while vertex-platform is scaled down.
# When vertex-platform is brought back up, replace these with real services.
apiVersion: v1
kind: Service
metadata:
  name: vertex-platform-auth
  namespace: default
  labels:
    app: vertex-platform
    stub: "true"
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vertex-platform-analytics
  namespace: default
  labels:
    app: vertex-platform
    stub: "true"
spec:
  type: ClusterIP
  ports:
    - port: 3005
      targetPort: 3005
      protocol: TCP
