apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podrick-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: default-podrick-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - podrick.el-jefe.me
    secretName: pop-portfolio-tls
  rules:
  - host: podrick.el-jefe.me
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podrick-dashboard
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: podrick-api
            port:
              number: 5001
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: podrick-api
            port:
              number: 5001
      - path: /applications
        pathType: Prefix
        backend:
          service:
            name: podrick-dashboard
            port:
              number: 80
      - path: /analytics
        pathType: Prefix
        backend:
          service:
            name: podrick-dashboard
            port:
              number: 80
