apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-apps-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Apply stripPrefix middleware to remove /app-name prefix before forwarding
    traefik.ingress.kubernetes.io/router.middlewares: default-portfolio-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: pop-portfolio.el-jefe.me
    http:
      paths:
      # Note: Bookmarked uses subdomain bookmarked-k8s.el-jefe.me (see bookmarked-ingress.yaml)
      # Note: FireBook uses subdomain firebook-k8s.el-jefe.me (see firebook-ingress.yaml)

      # IntervalAI
      - path: /intervalai
        pathType: Prefix
        backend:
          service:
            name: intervalai-client
            port:
              number: 80

      # Note: EducationELLy uses subdomain educationelly-k8s.el-jefe.me (see educationelly-ingress.yaml)
      # Note: EducationELLy GraphQL uses subdomain educationelly-graphql-k8s.el-jefe.me (see educationelly-graphql-ingress.yaml)
      # Note: Code Talk uses subdomain code-talk-k8s.el-jefe.me (see code-talk-ingress.yaml)
