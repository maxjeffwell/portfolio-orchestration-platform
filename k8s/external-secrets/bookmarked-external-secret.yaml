apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookmarked-external-secret
  namespace: default
spec:
  data:
  - remoteRef:
      key: CACHE_INVALIDATION_API_KEY
    secretKey: CACHE_INVALIDATION_API_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secret-store
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: bookmarked-credentials
