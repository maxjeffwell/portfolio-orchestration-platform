# Static PV for the ASUSTOR iSCSI LUN that backs the in-cluster NFS server.
# Created via ADM Storage Manager UI on Volume2 (internal SSD), 250GiB thin,
# block-level LUN named `cluster-backing` in target alias `cluster`.
# CRC32C header + data digest enabled at iSCSI level.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: asustor-iscsi-cluster-nfs
  labels:
    location: asustor
    tier: ssd
    type: cluster-nfs
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 250Gi
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: nfs-backing
    namespace: cluster-nfs
  iscsi:
    fsType: ext4
    iqn: iqn.2011-08.com.asustor:as5402t-43a7f3.cluster
    iscsiInterface: default
    lun: 0
    targetPortal: 10.0.0.4:3260
  # debian-marmoset ONLY. Was [vmi2951245, vmi3115606, marmoset] until
  # 2026-08-10.
  #
  # The iSCSI target (10.0.0.4) is the ASUSTOR at home. Measured RTT to it:
  # 0.388ms from debian-marmoset vs 52.8ms from the Contabo VPSes. iSCSI is
  # synchronous -- one round trip per I/O -- so from a VPS throughput
  # collapsed to ~1.2 MB/s (64KB / 0.053s). That made backing up this 16.1GB
  # volume consume the ENTIRE 4h Velero ItemBlock window every night, and it
  # also made the ext4 mount itself take ~8 minutes.
  #
  # The VPS nodes are excluded so this can never drift back onto a WAN-distant
  # node. `marmoset` is excluded deliberately (user decision): it is at home
  # and would be fast, but it is the GPU-tainted workstation, not a server.
  #
  # NOTE: nodeAffinity is IMMUTABLE on a bound PV -- changing it requires
  # deleting and recreating the PV (reclaimPolicy Retain, so data survives).
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - debian-marmoset
  persistentVolumeReclaimPolicy: Retain
  storageClassName: iscsi-local
  volumeMode: Filesystem
