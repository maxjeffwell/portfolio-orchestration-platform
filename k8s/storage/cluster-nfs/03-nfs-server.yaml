# In-cluster NFS server backed by ASUSTOR iSCSI LUN.
# Replaces the broken asustor-k8s NFS subdir provisioner.
# Architecture: ASUSTOR iSCSI block -> ext4 on cluster node -> kernel NFS export -> Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-server
  namespace: cluster-nfs
  labels:
    app: nfs-server
spec:
  replicas: 1
  strategy:
    type: Recreate  # iSCSI RWO can only attach to one node at a time
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
      annotations:
        # Exclude nfs-data from Velero fs-backup. Velero runs with
        # --default-volumes-to-fs-backup, so every volume is backed up unless
        # opted out here.
        #
        # Why: this pod is scheduled on vmi3115606 (Contabo VPS) while its PVC
        # is iSCSI to the ASUSTOR at home -- 52.8ms RTT vs 0.388ms from a home
        # node. iSCSI is synchronous, so throughput collapses to ~1.2 MB/s
        # (64KB / 0.053s). Backing up the 16.1GB volume therefore consumed the
        # ENTIRE 4h Velero ItemBlock window every night and was the direct
        # cause of the chronic ~79-error PartiallyFailed daily backups.
        #
        # Safe to exclude: nothing consumes the cluster-nfs StorageClass (0
        # PVCs), and /export holds only orphaned data -- garage remnants
        # (256 hash dirs + garage-marker; the live garage pods use
        # openebs-lvmpv) and a backrest subdirectory whose PV no longer
        # exists. Verified 2026-08-10.
        backup.velero.io/backup-volumes-excludes: nfs-data
    spec:
      # Pinned to debian-marmoset 2026-08-10. Was a soft preference for
      # vmi3115606 ("colocate with backrest") -- but backrest moved off this
      # NFS to the synology-nfs SC back in April, so the reason was stale
      # while the cost was not: vmi3115606 is a Contabo VPS 52.8ms from this
      # volume's iSCSI target (the ASUSTOR at home), vs 0.388ms from
      # debian-marmoset. Synchronous iSCSI over that link ran at ~1.2 MB/s.
      #
      # This is `required`, not `preferred`, and must stay in agreement with
      # the PV's own nodeAffinity in 01-pv-asustor-iscsi-cluster-nfs.yaml.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - debian-marmoset
      containers:
        - name: nfs-server
          # Image's default entrypoint disables NFSv3; we override CMD to enable v3+v4.
          image: itsthenetwork/nfs-server-alpine:12
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /export
              echo '/export *(rw,fsid=0,async,no_subtree_check,no_auth_nlm,insecure,no_root_squash)' > /etc/exports
              /sbin/rpcbind -w
              /usr/sbin/rpc.mountd --debug all --no-udp
              /usr/sbin/exportfs -ar
              /usr/sbin/rpc.nfsd -G 10 -V 3 -V 4
              echo "NFS server started with v3 and v4 enabled"
              while true; do sleep 60; done
          ports:
            - { name: nfs,         containerPort: 2049,  protocol: TCP }
            - { name: rpcbind-tcp, containerPort: 111,   protocol: TCP }
            - { name: rpcbind-udp, containerPort: 111,   protocol: UDP }
            - { name: mountd,      containerPort: 20048, protocol: TCP }
          securityContext:
            privileged: true  # required for kernel NFS modules
          volumeMounts:
            - name: nfs-data
              mountPath: /export
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: nfs-data
          persistentVolumeClaim:
            claimName: nfs-backing
---
# ClusterIP pinned to 10.43.67.16 because kubelet's NFS mount runs in host
# network namespace (no cluster DNS); pinning keeps the IP stable so the
# nfs-subdir-external-provisioner config doesn't drift.
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: cluster-nfs
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  clusterIP: 10.43.67.16
  selector:
    app: nfs-server
  ports:
    - { name: nfs,         port: 2049, protocol: TCP }
    - { name: rpcbind-tcp, port: 111,  protocol: TCP }
    - { name: rpcbind-udp, port: 111,  protocol: UDP }
