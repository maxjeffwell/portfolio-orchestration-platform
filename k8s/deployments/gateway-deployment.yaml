apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: default
  labels:
    app: graphql-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      serviceAccountName: gateway-sa
      containers:
      - name: graphql-gateway
        image: maxjeffwell/graphql-gateway:20260208-062132-2076cdd
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        - name: CORS_ORIGIN
          value: "https://el-jefe.me,https://portfolio.el-jefe.me"
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BROKERS
          value: "vertex-kafka-kafka-bootstrap.microservices.svc:9092"
        - name: KAFKA_CLIENT_ID
          value: "graphql-gateway"
        - name: KAFKA_GROUP_ID
          value: "graphql-gateway-group"
        - name: KAFKA_AI_EVENTS_TOPIC
          value: "ai.gateway.events"
        - name: ARGOCD_SERVER
          value: "argocd-server.argocd.svc:443"
        - name: ARGOCD_USERNAME
          valueFrom:
            secretKeyRef:
              name: gateway-credentials
              key: argocd-username
        - name: ARGOCD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gateway-credentials
              key: argocd-password
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: gateway-credentials
              key: github-token
        - name: GITHUB_OWNER
          value: "maxjeffwell"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
