apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: default
  labels:
    app: graphql-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: graphql-gateway
  template:
    metadata:
      labels:
        app: graphql-gateway
    spec:
      serviceAccountName: gateway-sa
      containers:
      - name: graphql-gateway
        image: maxjeffwell/graphql-gateway:20260206-212259-1e11de9
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "4000"
        - name: NODE_ENV
          value: "production"
        - name: CORS_ORIGIN
          value: "https://el-jefe.me"
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
        - name: KAFKA_ENABLED
          value: "true"
        - name: KAFKA_BROKERS
          value: "vertex-kafka-kafka-bootstrap.microservices.svc:9092"
        - name: KAFKA_CLIENT_ID
          value: "graphql-gateway"
        - name: KAFKA_GROUP_ID
          value: "graphql-gateway-group"
        - name: KAFKA_AI_EVENTS_TOPIC
          value: "ai.gateway.events"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
