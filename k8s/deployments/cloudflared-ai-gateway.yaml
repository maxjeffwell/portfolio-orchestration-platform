apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-ai-gateway
  namespace: default
spec:
  # 2 connectors on different nodes: this tunnel is the ONLY public path for
  # argocd/litellm/ai-gateway.el-jefe.me (their CNAMEs point at the tunnel, not the
  # edge Traefik). With one replica those names went dark during the 2026-09-30
  # m920s reboot. Cloudflare load-balances across connectors.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared-ai-gateway
  template:
    metadata:
      labels:
        app: cloudflared-ai-gateway
    spec:
      priorityClassName: portfolio-app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: cloudflared-ai-gateway
              topologyKey: kubernetes.io/hostname
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --protocol
        - http2  # Force HTTP/2 - VPS provider blocks QUIC/UDP
        - --edge-ip-version
        - "4"    # Pod has no IPv6 route; "auto" kept dialing 2606:4700::/32 edges (~3k "network is unreachable"/day)
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-ai-gateway
              key: token
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
# 2026-10-07: keep >= 1 tunnel connector through drains. The 2 replicas already
# sit on different nodes (required podAntiAffinity above); without this a drain
# could evict both and drop the Cloudflare tunnel until one restarts.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared-ai-gateway
  namespace: default
  labels:
    app: cloudflared-ai-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cloudflared-ai-gateway
