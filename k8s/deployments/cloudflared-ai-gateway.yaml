apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-ai-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-ai-gateway
  template:
    metadata:
      labels:
        app: cloudflared-ai-gateway
    spec:
      priorityClassName: portfolio-app
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --protocol
        - http2  # Force HTTP/2 - VPS provider blocks QUIC/UDP
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-ai-gateway
              key: token
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
