apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarked-client
  namespace: default
  labels:
    app: bookmarked
    component: client
    tier: frontend
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookmarked
      component: client
  template:
    metadata:
      labels:
        app: bookmarked
        component: client
        tier: frontend
        portfolio: "true"
    spec:
      containers:
      - name: bookmarked-client
        image: maxjeffwell/bookmarked-client:k8s
        imagePullPolicy: Always
        securityContext:
          runAsUser: 0
          capabilities:
            add:
              - NET_BIND_SERVICE
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookmarked-server
  namespace: default
  labels:
    app: bookmarked
    component: server
    tier: backend
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookmarked
      component: server
  template:
    metadata:
      labels:
        app: bookmarked
        component: server
        tier: backend
        portfolio: "true"
    spec:
      containers:
      - name: bookmarked-server
        image: maxjeffwell/bookmarks-react-hooks-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookmarked-secret
              key: database-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: bookmarked-secret
              key: openai-api-key
        - name: OPENAI_MODEL
          value: "gpt-4o-mini"
        - name: OPENAI_TEMPERATURE
          value: "0.4"
        - name: OPENAI_MAX_TOKENS
          value: "1000"
        - name: AI_FEATURES_ENABLED
          value: "true"
        - name: AI_CACHE_ENABLED
          value: "true"
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
