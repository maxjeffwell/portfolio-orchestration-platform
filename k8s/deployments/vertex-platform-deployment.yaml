apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertex-platform-auth
  namespace: default
  labels:
    app: vertex-platform-auth
    platform: vertex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vertex-platform-auth
  template:
    metadata:
      labels:
        app: vertex-platform-auth
        platform: vertex
    spec:
      containers:
      - name: auth-service
        image: maxjeffwell/vertex-platform-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
