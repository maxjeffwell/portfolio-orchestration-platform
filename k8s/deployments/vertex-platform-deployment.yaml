apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertex-platform-auth
  namespace: default
  labels:
    app: vertex-platform-auth
    platform: vertex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vertex-platform-auth
  template:
    metadata:
      labels:
        app: vertex-platform-auth
        platform: vertex
    spec:
      containers:
      - name: auth-service
        image: maxjeffwell/vertex-platform-auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: auth-database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertex-platform-analytics
  namespace: default
  labels:
    app: vertex-platform-analytics
    platform: vertex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vertex-platform-analytics
  template:
    metadata:
      labels:
        app: vertex-platform-analytics
        platform: vertex
    spec:
      containers:
      - name: analytics-service
        image: maxjeffwell/vertex-platform-analytics-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3005
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "3005"
        - name: NODE_ENV
          value: "production"
        - name: INFLUXDB_USERNAME
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-username
        - name: INFLUXDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-password
        - name: INFLUXDB_ORG
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-org
        - name: INFLUXDB_BUCKET
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-bucket
        - name: INFLUXDB_TOKEN
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-token
        - name: INFLUXDB_URL
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: influxdb-url
        - name: KAFKA_BROKERS
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-brokers
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-brokers
        - name: KAFKA_USERNAME
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-username
        - name: KAFKA_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-username
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-password
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vertex-platform-secret
              key: kafka-password
        - name: KAFKA_SSL
          value: "true"
        - name: KAFKA_SASL_MECHANISM
          value: "PLAIN"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
