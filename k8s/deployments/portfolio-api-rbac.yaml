# portfolio-api ServiceAccount + ClusterRole. Moved 2026-09-26 from k8s/ (unsynced)
# into k8s/deployments so the POP app manages it; matched live exactly.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portfolio-api-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portfolio-manager
# READ-ONLY since 2026-10-06: the dashboard is internet-facing, so the
# ServiceAccount can only observe. Scale/restart/delete need create/update/
# patch/delete back here AND READ_ONLY=false on the API (middleware/readOnly.js).
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portfolio-manager-binding
subjects:
- kind: ServiceAccount
  name: portfolio-api-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: portfolio-manager
  apiGroup: rbac.authorization.k8s.io
