apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-amd
  namespace: default
  labels:
    app: triton-amd
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-amd
  template:
    metadata:
      labels:
        app: triton-amd
        portfolio: "true"
    spec:
      priorityClassName: ai-workload
      nodeSelector:
        kubernetes.io/hostname: elitedesk
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.01-py3
          imagePullPolicy: IfNotPresent
          args:
            - tritonserver
            - --model-repository=/models
            - --allow-gpu-metrics=false
            - --model-control-mode=explicit
            - --load-model=interval_ai
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          hostPath:
            path: /home/maxjeffwell/ai-models
---
apiVersion: v1
kind: Service
metadata:
  name: triton-amd
  namespace: default
  labels:
    app: triton-amd
    portfolio: "true"
spec:
  selector:
    app: triton-amd
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
