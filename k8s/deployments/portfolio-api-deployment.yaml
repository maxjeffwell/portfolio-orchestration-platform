apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  namespace: default
  labels:
    app: portfolio-api
spec:
  # 2026-10-15: 2 replicas, rolling, spread across servers (+ PDB below) so a
  # server loss or a deploy never takes the API down.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: portfolio-api
  template:
    metadata:
      annotations:
        el-jefe.me/database: "patroni-2026-10-23"   # auth DB moved to the Patroni HA cluster; bump to roll pods
      labels:
        app: portfolio-api
    spec:
      priorityClassName: portfolio-app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: portfolio-api
      serviceAccountName: portfolio-api-sa
      containers:
      - name: portfolio-api
        image: maxjeffwell/portfolio-api:20261015-235449-9fbc569
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        # 2026-10-06: internet-facing dashboard -> no cluster mutations (see api/src/middleware/readOnly.js)
        - name: READ_ONLY
          value: "true"
        - name: CORS_ORIGIN
          value: "https://pop-portfolio.el-jefe.me"
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: auth-database-url
        - name: NODE_EXTRA_CA_CERTS   # Patroni cluster CA -> AUTH_DATABASE_URL uses sslmode=verify-full
          value: /etc/pg-ha/ca.crt
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: jwt-secret
        # Cross-replica login-attempt counter (api/src/utils/rateLimitStore.js).
        # Unset REDIS_URL = per-pod in-memory counter (2 replicas = 2x budget).
        - name: REDIS_URL
          value: redis://redis.default.svc.cluster.local:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: redis-password
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: admin-username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: admin-password
        - name: PROMETHEUS_URL
          value: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
        - name: GOTIFY_URL
          value: "http://gotify.monitoring:80"
        - name: GOTIFY_KEEL_APP_ID
          value: "1"
        - name: GOTIFY_APP_TOKEN
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: gotify-app-token
        - name: GOTIFY_CLIENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: gotify-client-token
        volumeMounts:
          - name: pg-ha-ca
            mountPath: /etc/pg-ha
            readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: pg-ha-ca   # Patroni cluster CA (secret pg-ha-ca, devops-portfolio-manager k8s/platform-external-secrets)
          secret:
            secretName: pg-ha-ca

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: portfolio-api
  namespace: default
  labels:
    app: portfolio-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: portfolio-api
