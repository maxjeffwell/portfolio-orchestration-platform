apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-api
  namespace: default
  labels:
    app: portfolio-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-api
  template:
    metadata:
      labels:
        app: portfolio-api
    spec:
      serviceAccountName: portfolio-api-sa
      containers:
      - name: portfolio-api
        image: maxjeffwell/portfolio-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: CORS_ORIGIN
          value: "https://pop-portfolio.el-jefe.me"
        - name: AUTH_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: auth-database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: jwt-secret
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: admin-username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: portfolio-api-secrets
              key: admin-password
        - name: PROMETHEUS_URL
          value: "http://prometheus-prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
