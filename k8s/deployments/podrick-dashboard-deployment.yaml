apiVersion: apps/v1
kind: Deployment
metadata:
  name: podrick-dashboard
  namespace: default
  labels:
    app: podrick-dashboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podrick-dashboard
  template:
    metadata:
      labels:
        app: podrick-dashboard
        component: frontend
    spec:
      containers:
      - name: dashboard
        image: maxjeffwell/devops-portfolio-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: VITE_API_URL
          value: "http://podrick-api:5001"
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - NET_BIND_SERVICE
