apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portfolio-api
  namespace: default
  labels:
    app: devops-portfolio-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-portfolio-api
  template:
    metadata:
      labels:
        app: devops-portfolio-api
        portfolio: "true"
    spec:
      serviceAccountName: portfolio-api-sa
      containers:
      - name: devops-portfolio-api
        image: maxjeffwell/portfolio-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          value: "production"
        - name: PROMETHEUS_URL
          value: "http://prometheus:9090"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: devops-portfolio-secrets
              key: auth-database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: devops-portfolio-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
