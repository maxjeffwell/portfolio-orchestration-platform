apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-embeddings
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-embeddings
  template:
    metadata:
      labels:
        app: triton-embeddings
        component: inference
        portfolio: "true"
    spec:
      # Pinned to elitedesk (2026-08-23): CPU-only Triton next to triton-amd,
      # serving bge_embeddings from the node-local model repository at
      # /home/maxjeffwell/ai-models (same hostPath triton-amd uses) instead of
      # the csi-s3 PVC. ovms-embeddings on debian-marmoset stays as-is.
      nodeSelector:
        kubernetes.io/hostname: elitedesk
      priorityClassName: ai-workload
      containers:
        - name: embeddings
          image: maxjeffwell/triton-embeddings-cpu:latest
          # Explicit model control: the shared repository also holds interval_ai
          # (served by triton-amd); loading only bge_embeddings keeps a foreign
          # model from ever blocking /v2/health/ready.
          args:
            - tritonserver
            - --model-repository=/models
            - --model-control-mode=explicit
            - --load-model=bge_embeddings
            - --allow-gpu-metrics=false
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8002
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          # 2026-09-22 memory 1Gi/2Gi -> 1.75Gi/3Gi. Steady state is 1.63-1.77 GiB
          # (flat, not a leak): config.pbtxt has instance_group count 2 on the
          # python backend, so two triton_python_backend_stub processes each
          # hold the 416 MB bge ONNX model plus its runtime (~820 MiB apiece).
          # 30-day peak 1.89 GiB was 94% of the old 2Gi limit.
          resources:
            # cpu request was 250m against a measured 2-day peak of ~0.6m. Same
            # reason as triton-amd: it is pinned to elitedesk, whose CPU requests
            # were 98% subscribed on ~30% real usage. The 2-core limit is
            # untouched, so real embedding load is unaffected.
            requests:
              cpu: 100m
              memory: 1792Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /home/maxjeffwell/ai-models
            type: Directory
