apiVersion: apps/v1
kind: Deployment
metadata:
  name: intervalai-client
  namespace: default
  labels:
    app: intervalai
    component: client
    tier: frontend
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intervalai
      component: client
  template:
    metadata:
      labels:
        app: intervalai
        component: client
        tier: frontend
        portfolio: "true"
    spec:
      containers:
      - name: intervalai-client
        image: maxjeffwell/spaced-repetition-capstone-client:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intervalai-server
  namespace: default
  labels:
    app: intervalai
    component: server
    tier: backend
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intervalai
      component: server
  template:
    metadata:
      labels:
        app: intervalai
        component: server
        tier: backend
        portfolio: "true"
    spec:
      containers:
      - name: intervalai-server
        image: maxjeffwell/spaced-repetition-capstone-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: CLIENT_ORIGIN
          value: "https://intervalai-k8s.el-jefe.me"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: intervalai-secret
              key: mongodb-uri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: intervalai-secret
              key: jwt-secret
        - name: TFJS_BACKEND
          value: "node"
        - name: USE_TRITON
          value: "true"
        - name: USE_SERVER_PREDICTION
          value: "true"
        - name: TRITON_MODEL_NAME
          value: "interval_ai"
        - name: PRIMARY_TRITON_URL
          value: "https://intervalai-triton.el-jefe.me"
        - name: RUNPOD_URL
          value: "https://api.runpod.ai/v2/7a2s0z4p6x0i8n"
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              name: intervalai-secret
              key: runpod-api-key
        - name: FALLBACK_TRITON_URL
          value: "http://triton-service:8000"
        - name: API_ONLY
          value: "true"
        - name: AI_PROVIDER
          value: "gateway"
        - name: AI_GATEWAY_URL
          value: "http://shared-ai-gateway-service:8002"
        resources:
          requests:
            memory: "128Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
