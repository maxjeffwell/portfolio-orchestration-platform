apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-adapter
  namespace: default
  labels:
    app: embedding-adapter
    component: inference
    portfolio: "true"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: embedding-adapter
  template:
    metadata:
      labels:
        app: embedding-adapter
        component: inference
        portfolio: "true"
    spec:
      # Pinned to debian-marmoset (colocated with triton-embeddings).
      nodeSelector:
        kubernetes.io/hostname: debian-marmoset
      priorityClassName: ai-workload
      # 2026-06-10 — DNS race fixed cluster-wide by NodeLocal DNSCache
      # (devops-portfolio-manager k8s/nodelocaldns): the on-node cache forwards
      # misses to CoreDNS over TCP, so the per-pod use-vc/single-request-reopen
      # workaround is no longer needed. /health uses the in-cluster FQDN (kept).
      containers:
        - name: embedding-adapter
          image: maxjeffwell/embedding-adapter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # External primary https://embeddings.el-jefe.me is returning 403/502
            # at the ingress (Traefik/CrowdSec) and added 4-6s of DNS+HTTP latency
            # to every /health probe. Both legs point at the co-located in-cluster
            # Triton (FQDN; resolves in one query thanks to dnsConfig ndots:1)
            # until the external ingress is repaired.
            - name: TRITON_PRIMARY_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: TRITON_FALLBACK_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: MODEL_NAME
              value: bge_embeddings
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
