apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-adapter
  namespace: default
  labels:
    app: embedding-adapter
    component: inference
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-adapter
  template:
    metadata:
      labels:
        app: embedding-adapter
        component: inference
        portfolio: "true"
    spec:
      # Pinned to debian-marmoset (colocated with triton-embeddings).
      nodeSelector:
        kubernetes.io/hostname: debian-marmoset
      priorityClassName: ai-workload
      # DNS hardening. The /health endpoint synchronously resolves the Triton
      # backend on every probe, and intermittent 5-10s glibc resolution stalls
      # were tripping the probe timeouts and crash-looping the pod. Root cause is
      # the glibc parallel A+AAAA "UDP conntrack race" (one reply dropped -> 5s
      # retransmit), which happens even for a single FQDN.
      #   - ndots:1            -> FQDN resolves in one query, no search-list walk
      #   - single-request-reopen -> serialize A/AAAA on separate sockets
      #   - use-vc             -> resolve over TCP; eliminates the UDP race
      # Validated: use-vc drops worst-case lookup from ~7s to ~2.6s with zero 5s
      # stalls over 30 samples.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen
          - name: use-vc
      containers:
        - name: embedding-adapter
          image: maxjeffwell/embedding-adapter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # External primary https://embeddings.el-jefe.me is returning 403/502
            # at the ingress (Traefik/CrowdSec) and added 4-6s of DNS+HTTP latency
            # to every /health probe. Both legs point at the co-located in-cluster
            # Triton (FQDN; resolves in one query thanks to dnsConfig ndots:1)
            # until the external ingress is repaired.
            - name: TRITON_PRIMARY_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: TRITON_FALLBACK_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: MODEL_NAME
              value: bge_embeddings
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
