apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-adapter
  namespace: default
  labels:
    app: embedding-adapter
    component: inference
    portfolio: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding-adapter
  template:
    metadata:
      labels:
        app: embedding-adapter
        component: inference
        portfolio: "true"
    spec:
      # Pinned to debian-marmoset (colocated with triton-embeddings).
      nodeSelector:
        kubernetes.io/hostname: debian-marmoset
      priorityClassName: ai-workload
      # ndots:1 so a fully-qualified service name resolves in a single query
      # instead of walking the default ndots:5 search list. The search-list walk
      # was triggering intermittent 5-10s glibc A/AAAA resolution stalls (UDP
      # conntrack race), which made /health exceed its probe timeouts and put the
      # pod into a restart loop.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: embedding-adapter
          image: maxjeffwell/embedding-adapter:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # External primary https://embeddings.el-jefe.me is returning 403/502
            # at the ingress (Traefik/CrowdSec) and added 4-6s of DNS+HTTP latency
            # to every /health probe. Both legs point at the co-located in-cluster
            # Triton (FQDN; resolves in one query thanks to dnsConfig ndots:1)
            # until the external ingress is repaired.
            - name: TRITON_PRIMARY_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: TRITON_FALLBACK_URL
              value: http://triton-embeddings.default.svc.cluster.local:8000
            - name: MODEL_NAME
              value: bge_embeddings
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
