configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      credential:
        name: velero-garage-credentials
        key: cloud
      config:
        region: garage
        s3ForcePathStyle: true
        s3Url: http://garage.monitoring.svc.cluster.local:3900
  # backblaze BSL is owned by the devops-portfolio-manager `backups` ArgoCD app
  # (k8s/backups/velero-backblaze-bsl.yaml) with prefix: velero. Kept out of the
  # Helm install so the chart can't create a competing Helm-owned BSL.
  defaultVolumesToFsBackup: true
  features: EnableCSI
  # Chart defaults are clientQPS:20 / clientBurst:30 — far too low for ~4871-item
  # backups; the client-go rate limiter saturates and silently skips pod volumes.
  clientQPS: 100
  clientBurst: 200
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: garage
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1

# The chart shipped the server container with no resource requests, so the velero
# server ran as QoS BestEffort — the kubelet's FIRST eviction target under node
# memory pressure. On 2026-06-03 ~06:17 the BestEffort server was evicted off the
# 30Gi worker (vmi3115606) mid-backup; on restart Velero marked every still-running
# backup Failed ("found a backup with status InProgress during the server starting").
# Two backups died together in that one restart (daily-backup-20260603020004 +
# verify-nas-109-220933). A memory request lifts the server to Burstable so it is no
# longer evicted first. No CPU limit on purpose — avoid throttling backup coordination.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 1Gi

credentials:
  existingSecret: cloud-credentials

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.8.0
    volumeMounts:
      - mountPath: /target
        name: plugins

deployNodeAgent: true
nodeAgent:
  podVolumePath: /var/lib/kubelet/pods
  # Wire the node-agent-config ConfigMap so loadConcurrency actually loads.
  # Without this flag the default is 1 data-path/node — a single orphaned
  # InProgress PVB (e.g. left by a node-agent restart during a WG/flannel flap)
  # then starves ALL backups. 3 keeps backups flowing if one PVB wedges.
  extraArgs:
    # Chart prefixes configMaps names with the release name → velero-node-agent-config.
    - --node-agent-configmap=velero-node-agent-config

# Governed node-agent config (replaces the previously hand-applied, malformed
# configmap whose data value was YAML — Velero json.Unmarshals it, so YAML
# silently failed to parse and fell back to concurrency 1). Value MUST be JSON.
configMaps:
  node-agent-config:
    data:
      node-agent-config.json: |
        {"loadConcurrency":{"globalConfig":3}}

# Velero exposes Prometheus metrics on :8085 but NOTHING scraped them — no
# ServiceMonitor existed, so velero_backup_* metrics were never collected and the
# velero-backup-alerts PrometheusRule (PartiallyFailed/Unavailable, severity=critical)
# could never fire. That is why weeks of failed backups never paged. Enable the
# ServiceMonitor + node-agent PodMonitor; `release: prometheus` is the label the
# kube-prometheus operator selects on (matches the scraped goldpinger ServiceMonitor).
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus
  nodeAgentPodMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

snapshotsEnabled: true

upgradeCRDs: false
