# Allows Bookmarked + TenantFlow to reach the cnpg-bookmarked CNPG cluster.
# Mirrors the pattern of allow-apps-to-cnpg-{auth,lunary}.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apps-to-cnpg-bookmarked
  namespace: default
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: cnpg-bookmarked
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bookmarked-server
        - podSelector:
            matchLabels:
              app: tenantflow
      ports:
        - protocol: TCP
          port: 5432
