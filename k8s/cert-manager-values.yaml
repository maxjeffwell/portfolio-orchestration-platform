# cert-manager node placement + leader election override
# cert-manager v1.13.3 was installed via manifests (not Helm).
# Runs on control-plane (vmi2951245) so leader election lease renewals
# use loopback to the local API server, avoiding cross-node latency.
#
# After reinstalling, apply these patches:
#
# 1. Move all components to the control-plane node:
#   PATCH='{"spec":{"template":{"spec":{"nodeSelector":{"kubernetes.io/hostname":"vmi2951245","kubernetes.io/os":"linux"}}}}}'
#   for d in cert-manager cert-manager-cainjector cert-manager-webhook; do
#     kubectl patch deployment $d -n cert-manager --type=merge -p "$PATCH"
#   done
#
# 2. Extend leader election timeouts (safety margin for API server load):
#   kubectl patch deployment cert-manager -n cert-manager --type=json \
#     -p='[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--v=2","--cluster-resource-namespace=$(POD_NAMESPACE)","--leader-election-namespace=kube-system","--acme-http01-solver-image=quay.io/jetstack/cert-manager-acmesolver:v1.13.3","--max-concurrent-challenges=60","--leader-election-lease-duration=120s","--leader-election-renew-deadline=90s"]}]'
#   kubectl patch deployment cert-manager-cainjector -n cert-manager --type=json \
#     -p='[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--v=2","--leader-election-namespace=kube-system","--leader-election-lease-duration=120s","--leader-election-renew-deadline=90s"]}]'
#
# If migrating to Helm install (jetstack/cert-manager), use these values:

nodeSelector:
  kubernetes.io/hostname: vmi2951245

cainjector:
  nodeSelector:
    kubernetes.io/hostname: vmi2951245
  extraArgs:
    - --leader-election-lease-duration=120s
    - --leader-election-renew-deadline=90s

webhook:
  nodeSelector:
    kubernetes.io/hostname: vmi2951245

extraArgs:
  - --leader-election-lease-duration=120s
  - --leader-election-renew-deadline=90s
