apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-lunary
  namespace: default
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  instances: 2
  priorityClassName: portfolio-critical
  inheritedMetadata:
    labels:
      portfolio: "true"
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    # PVC uses democratic-csi-mp; that driver's node DaemonSet is pinned
    # to debian-marmoset, so the consumer must be too.
    # See memory: democratic-csi-consumers-pinned-2026-05-21
    nodeSelector:
      kubernetes.io/hostname: debian-marmoset
  probes:
    liveness:
      isolationCheck:
        enabled: true
        connectionTimeout: 5000
        requestTimeout: 5000
  bootstrap:
    # NOTE: bootstrap only runs on initial cluster creation. The current live cluster
    # was rebuilt 2026-05-06 from VolumeSnapshot cnpg-lunary-daily-20260504030000
    # after both PVs entered I/O-error state following Synology iSCSI snapshot-quota
    # exhaustion. The ~62h of data between May 4 03:00 UTC and recovery time is gone.
    # If this cluster is ever destroyed and re-created, change `initdb` to
    # `recovery.volumeSnapshots.storage.name: <latest-good-snapshot>` BEFORE re-applying.
    initdb:
      database: lunary
      owner: neondb_owner
      secret:
        name: cnpg-lunary-app
  storage:
    size: 5Gi
    storageClass: synology-iscsi
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  backup:
    volumeSnapshot:
      className: synology-snapshotclass
