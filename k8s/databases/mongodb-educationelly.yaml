apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-educationelly-pvc
  namespace: default
  labels:
    app: mongodb-educationelly
    tier: database
    protected: "true"
  annotations:
    helm.sh/resource-policy: keep
    description: "Protected PVC - manual deletion required"
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-educationelly-secrets
  namespace: default
  labels:
    app: mongodb-educationelly
    protected: "true"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  mongodb-root-password: "educationelly_mongo123"
  educationelly-db-password: "educationelly123"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-educationelly
  namespace: default
  labels:
    app: mongodb-educationelly
    tier: database
    protected: "true"
  annotations:
    helm.sh/resource-policy: keep
    description: "Protected database - requires manual deletion"
spec:
  serviceName: mongodb-educationelly
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-educationelly
  template:
    metadata:
      labels:
        app: mongodb-educationelly
        tier: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: mongodb
        image: mongo:6
        ports:
        - containerPort: 27017
          name: mongodb
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-educationelly-secrets
              key: mongodb-root-password
        - name: MONGO_INITDB_DATABASE
          value: "educationelly"
        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
              - mongosh
              - --eval
              - "db.adminCommand('ping')"
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-educationelly-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-educationelly
  namespace: default
  labels:
    app: mongodb-educationelly
spec:
  type: ClusterIP
  ports:
  - port: 27017
    targetPort: 27017
    protocol: TCP
    name: mongodb
  selector:
    app: mongodb-educationelly
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb-educationelly-pdb
  namespace: default
  labels:
    app: mongodb-educationelly
    tier: database
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mongodb-educationelly
