# tenantflow-neon: self-hosted Neon (KubeBlocks addon neon-1.0.1) backing
# TENANTFLOW (platform-backend PAGESERVER_URL -> this pageserver). Applied with
# kubectl, NOT ArgoCD. Run `kubectl diff -f` before any apply.
#
# 2026-09-26: regenerated from the LIVE cluster. The previous file had drifted
# ~85 lines (e.g. pageserver on a 5Gi openebs-lvmpv volume with no S3 creds;
# live is mayastor-2 25Gi + garage remote storage), so applying it would have
# broken the pageserver.
#
# Safekeepers (3, WAL quorum 2/3), one per storage node since 2026-09-26:
#   sk-0 m920s     (openebs-lvmpv-vg0, local LV)
#   sk-1 elitedesk (openebs-lvmpv,     local LV)
#   sk-2 m720q     (openebs-lvmpv,     local LV)
# sk-0 and sk-1 were moved off debian-marmoset one at a time via
# offlineInstances. Their PVCs (data-* holds the WAL, neon-safekeeper-* is an
# unused extra VCT) were PRE-CREATED on the target node and chowned to
# neonuser 998:996. The local PVs node-pin each safekeeper. To move one again:
# offline it (replicas 2 + offlineInstances), recreate both PVCs on the new
# node, chown, then replicas 3 + offlineInstances [].
#
# broker + compute (2026-09-26): moved off debian-marmoset. Both are restricted
# to Mayastor storage nodes (openebs.io/engine=mayastor) with 30s
# not-ready/unreachable tolerations (default 300s), so a dead node means a
# ~30-60s restart elsewhere, not 5 min. Neither can have more replicas: a Neon
# timeline allows ONE writer compute, and the broker is a stateless
# coordinator with a minimum of 1 replica. The broker's unused 'data' VCT is
# now mayastor-2-thin (network-attached, so it doesn't node-pin the pod).
# 🪤 KubeBlocks' update DAG (broker -> safekeeper+pageserver -> compute)
# stalled: the middle layer was never re-stamped with the new cluster
# generation, so the compute change waited forever ("waiting for predecessor
# component in DAG"). Workaround used: apply the same schedulingPolicy
# directly to the compute Component object.
#
# compute: TENANT/TIMELINE pinned. Without them the addon creates a NEW empty
# tenant on every compute start.
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: tenantflow-neon
  namespace: neon
  labels:
    app: tenantflow
    clusterdefinition.kubeblocks.io/name: neon
    portfolio: 'true'
spec:
  clusterDef: neon
  componentSpecs:
  - componentDef: neon-pageserver-1.0.1
    env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          key: AWS_ACCESS_KEY_ID
          name: neon-pageserver-s3
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          key: AWS_SECRET_ACCESS_KEY
          name: neon-pageserver-s3
    name: neon-pageserver
    podUpdatePolicy: PreferInPlace
    replicas: 1
    resources:
      limits:
        cpu: '2'
        memory: 4Gi
      requests:
        cpu: 50m
        memory: 256Mi
    serviceVersion: 1.0.0
    volumeClaimTemplates:
    - name: neon-pageserver
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 25Gi
        storageClassName: mayastor-2
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 25Gi
        storageClassName: mayastor-2
  - annotations:
      kubeblocks.io/restart: '2026-09-06T21:53:03Z'
    componentDef: neon-safekeeper-1.0.1
    name: neon-safekeeper
    podUpdatePolicy: PreferInPlace
    replicas: 3
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    schedulingPolicy:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: tenantflow-neon
                  apps.kubeblocks.io/component-name: neon-safekeeper
              topologyKey: kubernetes.io/hostname
            weight: 100
    serviceVersion: 1.0.0
    volumeClaimTemplates:
    - name: neon-safekeeper
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: openebs-lvmpv
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: openebs-lvmpv
  - annotations:
      kubeblocks.io/restart: '2026-09-06T21:53:03Z'
    componentDef: neon-broker-1.0.1
    name: neon-broker
    podUpdatePolicy: PreferInPlace
    replicas: 1
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi
    schedulingPolicy:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: openebs.io/engine
                operator: In
                values:
                - mayastor
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 30
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 30
    serviceVersion: 1.0.0
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
        storageClassName: mayastor-2-thin
  - componentDef: neon-compute-1.0.1
    env:
    - name: TENANT
      value: 77a948ddeeb9fc8fd31daad9bdc4bea7
    - name: TIMELINE
      value: 01ee6c87fb000f298c1b0b0904ca461e
    name: neon-compute
    podUpdatePolicy: PreferInPlace
    replicas: 1
    resources:
      limits:
        cpu: '2'
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
    schedulingPolicy:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: openebs.io/engine
                operator: In
                values:
                - mayastor
      tolerations:
      - effect: NoExecute
        key: node.kubernetes.io/not-ready
        operator: Exists
        tolerationSeconds: 30
      - effect: NoExecute
        key: node.kubernetes.io/unreachable
        operator: Exists
        tolerationSeconds: 30
    serviceVersion: 1.0.0
  terminationPolicy: Delete
  topology: default
