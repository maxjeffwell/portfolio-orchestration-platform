apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: neon-cluster
  namespace: default
  labels:
    clusterdefinition.kubeblocks.io/name: neon
spec:
  # 2026-09-26: synced to live. All components run on m720q (git still said
  # debian-marmoset; applying the old file would have moved them to the laptop).
  # Applied with kubectl, NOT ArgoCD (the ArgoCD app only covers k8s/deployments).
  clusterDef: neon
  topology: default
  # 2026-09-26: WipeOut -> DoNotTerminate. WipeOut erased data AND backups on
  # delete; this cluster backs bookmarked + tenantflow. KubeBlocks now refuses
  # to delete it until this is changed.
  terminationPolicy: DoNotTerminate
  componentSpecs:
  - name: neon-pageserver
    componentDef: neon-pageserver-1.0.1
    serviceVersion: 1.0.0
    replicas: 1
    podUpdatePolicy: PreferInPlace
    schedulingPolicy:
      nodeSelector:
        kubernetes.io/hostname: m720q
    env:
    - name: NEON_S3_BUCKET
      value: neon-storage
    - name: NEON_S3_ENDPOINT
      value: http://garage.monitoring.svc.cluster.local:3900
    - name: NEON_S3_REGION
      value: garage
    - name: NEON_S3_PREFIX
      value: pageserver/
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: { name: neon-cluster-s3-creds, key: AWS_ACCESS_KEY_ID }
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: { name: neon-cluster-s3-creds, key: AWS_SECRET_ACCESS_KEY }
    resources:
      limits: { memory: 512Mi }
      requests: { cpu: 30m, memory: 192Mi }
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mayastor-1
        resources:
          requests: { storage: 10Gi }
  - name: neon-safekeeper
    componentDef: neon-safekeeper-1.0.1
    serviceVersion: 1.0.0
    # 2026-09-26: 1 -> 3 (WAL quorum 2/3). One per Mayastor storage node,
    # preferred not required so a down node's safekeeper can reschedule.
    # safekeeper-1/-2 PVCs were PRE-CREATED on mayastor-2 and chowned to
    # neonuser 998:996 (a fresh volume is root-owned and the safekeeper
    # crash-loops "Failed to create id file ... Permission denied").
    # safekeeper-0's volume (mayastor-1 class) also has 2 replicas.
    replicas: 3
    podUpdatePolicy: PreferInPlace
    schedulingPolicy:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: openebs.io/engine
                operator: In
                values: [mayastor]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: neon-cluster
                  apps.kubeblocks.io/component-name: neon-safekeeper
              topologyKey: kubernetes.io/hostname
    annotations:
      backup.velero.io/backup-volumes-excludes: data
    resources:
      limits: { memory: 256Mi }
      requests: { cpu: 20m, memory: 64Mi }
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mayastor-1
        resources:
          requests: { storage: 5Gi }
  - name: neon-broker
    componentDef: neon-broker-1.0.1
    serviceVersion: 1.0.0
    replicas: 1
    podUpdatePolicy: PreferInPlace
    schedulingPolicy:
      nodeSelector:
        kubernetes.io/hostname: m720q
    annotations:
      backup.velero.io/backup-volumes-excludes: data
    resources:
      limits: { memory: 128Mi }
      requests: { cpu: 20m, memory: 64Mi }
  - name: neon-compute
    componentDef: neon-compute-1.0.1
    serviceVersion: 1.0.0
    replicas: 1
    podUpdatePolicy: PreferInPlace
    schedulingPolicy:
      nodeSelector:
        kubernetes.io/hostname: m720q
    # 2026-09-26: PIN the tenant/timeline. Without TENANT, the addon's
    # compute.sh creates a NEW empty tenant on every compute start (that is
    # where the ~38 stray tenants came from).
    env:
    - name: TENANT
      value: 8d45e2a64d43b7a26944909284b9dc90
    - name: TIMELINE
      value: 6ab65b49168b055e311e255d58574d7c
    resources:
      limits: { memory: 512Mi }
      requests: { cpu: 50m, memory: 128Mi }
