apiVersion: v1
kind: Service
metadata:
  name: pop-portfolio-dashboard
  namespace: default
  labels:
    app: pop-portfolio-dashboard
spec:
  type: ClusterIP
  selector:
    app: pop-portfolio-dashboard
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  sessionAffinity: None
