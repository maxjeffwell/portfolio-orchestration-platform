# KubeBlocks -- Helm release `kubeblocks`, ns kb-system
# Chart kubeblocks/kubeblocks 1.0.2 (repo https://apecloud.github.io/helm-charts). NOT ArgoCD-managed.
# Captured into git 2026-09-27 from the release's full user values. Upgrade with:
#   helm upgrade kubeblocks kubeblocks/kubeblocks --version 1.0.2 -n kb-system -f k8s/kubeblocks-values.yaml
# affinity/tolerations (2026-09-30): the chart-default kb-controller preference and
# toleration are NULLED here (no node carries that label or taint; user asked to remove
# it). `affinity: null` is required — an empty map would not override the chart default.
# The elitedesk/m720q hostname preferences from 2026-09-27 were removed earlier — scheduler-placed.
# 🪤 dataProtection.affinity is ALSO passed as an env var to the MAIN controller, so
#    changing it restarts both pods.
# 🪤 The chart re-renders existing Addons via `lookup`; a manifest diff shows fake Addon
#    changes. Compare rendered Addon .spec against `kubectl get addons` instead.
affinity: null
# 2026-10-01: DataProtection DISABLED (user decision). Never exercised: 0 BackupRepo /
# BackupPolicy / BackupSchedule / Backup ever; both Neon clusters have no spec.backup and
# the neon addon ships no BackupPolicyTemplate. The flag removes ONLY the
# kubeblocks-dataprotection Deployment + its worker SA/ClusterRole (500m/1Gi request);
# the 11 StorageProvider CRs are NOT gated by it and stay as inert catalog entries.
# Re-enable before deploying any addon cluster that should have KubeBlocks-native backups.
dataProtection:
  enabled: false
  affinity: null
  tolerations: []
tolerations: []
