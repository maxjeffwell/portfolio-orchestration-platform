version: '3.8'

networks:
  shared-infrastructure_app-network:
    external: true

services:
  intervalai-server:
    image: maxjeffwell/spaced-repetition-capstone-server:latest
    container_name: spaced-repetition-server
    environment:
      - NODE_ENV=production
      - PORT=8080
      # MongoDB Atlas (same as VPS)
      - MONGODB_URI=mongodb+srv://maxjeffwell2:88ZIAhtp3@spaced-repetition.juv8wvf.mongodb.net/spaced-repetition?appName=spaced-repetition
      - JWT_SECRET=development-secret
      - JWT_EXPIRY=7d
      # Allow both local and public domain
      - CLIENT_ORIGIN=https://intervalai.el-jefe.me,http://intervalai.local
    networks:
      - shared-infrastructure_app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  intervalai-client:
    image: maxjeffwell/spaced-repetition-capstone-client:latest
    container_name: spaced-repetition-client
    # No environment variable needed - API URL is baked into the image at build time as /api
    depends_on:
      - intervalai-server
    networks:
      - shared-infrastructure_app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
