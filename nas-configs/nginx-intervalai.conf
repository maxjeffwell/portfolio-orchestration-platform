# Add this to /ssd/docker/nginx/nginx.conf
# Replace the existing spaced-repetition server block with this:

    # IntervalAI (spaced-repetition)
    server {
        listen 80;
        server_name intervalai.el-jefe.me intervalai.local spaced-repetition.local;

        location / {
            proxy_pass http://spaced-repetition-client:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API route - THIS WAS MISSING!
        location /api {
            proxy_pass http://spaced-repetition-server:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
